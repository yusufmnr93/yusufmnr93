<svg xmlns="http://www.w3.org/2000/svg" width="900" height="90" viewBox="0 0 900 90" role="img" aria-label="Terima kasih sudah mampir">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#16123a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: 'Segoe UI', 'Fira Code', Consolas, monospace; }
    .msg { font-size: 16px; fill: #94a3b8; }
    .trail { stroke: #1e293b; stroke-width: 4; stroke-linecap: round; }
    .glow { stroke: url(#accent); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 820; stroke-dashoffset: 820; animation: draw 6s ease-in-out infinite; }
    .dot { fill: #fbbf24; animation: move 6s ease-in-out infinite; }
    .end { fill: #f472b6; animation: pulse 1.6s ease-in-out infinite; }
    .start { fill: #34d399; }
    @keyframes draw { 0% { stroke-dashoffset: 820; } 70%, 90% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 820; } }
    @keyframes move { 0% { transform: translateX(0); opacity: 1; } 70% { transform: translateX(820px); opacity: 1; } 90%, 100% { transform: translateX(820px); opacity: 0; } }
    @keyframes pulse { 0%,100% { opacity: .7; } 50% { opacity: 1; } }
  </style>
  <rect width="900" height="90" rx="16" fill="url(#bg)"/>
  <line class="trail" x1="40" y1="34" x2="860" y2="34"/>
  <line class="glow" x1="40" y1="34" x2="860" y2="34"/>
  <circle class="start" cx="40" cy="34" r="7"/>
  <circle class="end" cx="860" cy="34" r="7"/>
  <circle class="dot" cx="40" cy="34" r="5"/>
  <text class="msg" x="450" y="70" text-anchor="middle">Terima kasih sudah mampir. Sampai ketemu di commit berikutnya.</text>
</svg>
