<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="Yusuf - Mahasiswa Teknik Informatika, Flutter dan AI" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: 'Segoe UI', 'Fira Code', Consolas, monospace; }
    .name { font-size: 56px; font-weight: 700; fill: url(#accent); }
    .hi { font-size: 18px; fill: #94a3b8; }
    .line { font-size: 22px; fill: #e2e8f0; opacity: 0; animation: cycle 9s infinite; }
    .l2 { animation-delay: 3s; }
    .l3 { animation-delay: 6s; }
    .sym { font-size: 28px; fill: #475569; opacity: .55; animation: float 6s ease-in-out infinite; }
    .s2 { animation-delay: -2s; }
    .s3 { animation-delay: -4s; }
    .cursor { fill: #38bdf8; animation: blink 1s steps(1) infinite; }
    .bar { fill: url(#accent); transform-origin: 60px 0; animation: grow 3s ease-out 1 both; }
    @keyframes cycle {
      0%   { opacity: 0; transform: translateY(10px); }
      5%   { opacity: 1; transform: translateY(0); }
      30%  { opacity: 1; transform: translateY(0); }
      35%  { opacity: 0; transform: translateY(-6px); }
      100% { opacity: 0; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-14px); }
    }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  </style>

  <rect width="900" height="220" rx="16" fill="url(#bg)"/>

  <text class="sym" x="700" y="70">&lt;/&gt;</text>
  <text class="sym s2" x="790" y="150">{ }</text>
  <text class="sym s3" x="640" y="170">( )</text>

  <text class="hi" x="60" y="62">Hai, aku</text>
  <text class="name" x="60" y="118">Yusuf</text>
  <rect class="bar" x="60" y="130" width="120" height="4" rx="2"/>

  <g transform="translate(60,172)">
    <text class="line" x="0" y="0">Flutter developer in the making</text>
    <text class="line l2" x="0" y="0">Belajar AI lewat proyek nyata</text>
    <text class="line l3" x="0" y="0">Bikin yang benar-benar dipakai</text>
  </g>
  <rect class="cursor" x="420" y="152" width="3" height="26"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
